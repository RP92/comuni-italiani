# Production source configuration for comuni-italiani pipeline.
# Run: python -m comuni_italiani.cli sources.toml
#
# Remote files are cached in .cache/ on first download.
# Delete .cache/<file> to force a fresh download on the next run.
#
# Column names, ZIP members, delimiters and encodings below were verified
# against the actual 2026 source files (see docs/cap-source.md).

# ---------------------------------------------------------------------------
# ISTAT "Elenco comuni italiani" — anagrafica, territorial codes, sigla,
# codice catastale, capoluogo flag, geographic zone.
# License: CC BY 4.0 — https://www.istat.it/note-legali/
# Encoding is Windows-1252 (cp1252); the header embeds newlines inside quoted
# cells, which the reader handles via a CSV stream. No remap: the parser
# matches the ISTAT header strings (whitespace-normalized).
# ---------------------------------------------------------------------------
[anagrafica]
url = "https://www.istat.it/storage/codici-unita-amministrative/Elenco-comuni-italiani.csv"
cache = "istat_anagrafica.csv"
delimiter = ";"
encoding = "cp1252"

# ---------------------------------------------------------------------------
# ISTAT POSAS — "Popolazione residente per età, sesso e stato civile".
# The CSV has a title line (skipped) then one row per (comune, età); the
# per-comune total is the row with Età = "999". We keep only those rows.
# License: CC BY 4.0
# ---------------------------------------------------------------------------
[popolazione]
url = "https://demo.istat.it/data/posas/POSAS_2024_it_Comuni.zip"
cache = "istat_posas.zip"
member = "POSAS_2024_it_Comuni.csv"
delimiter = ";"
encoding = "utf-8-sig"
skip_lines = 1
[popolazione.filter]
column = "Età"
equals = "999"
[popolazione.columns]
codice = "Codice comune"
popolazione = "Totale"

# ---------------------------------------------------------------------------
# Superficie (km²) — from Garda Informatica gi_comuni.csv (column superficie_kmq,
# Italian decimal comma). ISTAT does not ship superficie in the elenco comuni,
# so we take it from the same Garda archive used for coordinate/CAP.
# License: MIT — https://www.gardainformatica.it/database-comuni-italiani
# ---------------------------------------------------------------------------
[superficie]
url = "https://www.gardainformatica.it/gi_db_comuni/gi_db_comuni-2026-08-07-8ef58.zip"
cache = "garda.zip"
member = "csv/gi_comuni.csv"
delimiter = ";"
encoding = "utf-8"
key_by = "codiceCatastale"   # Garda ISTAT codes lag ISTAT's (Sardegna); join on Belfiore code
[superficie.columns]
codice = "codice_belfiore"
superficie = "superficie_kmq"

# ---------------------------------------------------------------------------
# Coordinates (lat/lng) — Garda gi_comuni.csv. The source column is "lon"
# (mapped to lng); values use the Italian decimal comma.
# ---------------------------------------------------------------------------
[coordinate]
url = "https://www.gardainformatica.it/gi_db_comuni/gi_db_comuni-2026-08-07-8ef58.zip"
cache = "garda.zip"
member = "csv/gi_comuni.csv"
delimiter = ";"
encoding = "utf-8"
key_by = "codiceCatastale"
[coordinate.columns]
codice = "codice_belfiore"
lat = "lat"
lng = "lon"

# ---------------------------------------------------------------------------
# CAP (postal codes) — Garda gi_cap.csv, one row per (comune, CAP).
# ---------------------------------------------------------------------------
[cap]
url = "https://www.gardainformatica.it/gi_db_comuni/gi_db_comuni-2026-08-07-8ef58.zip"
cache = "garda.zip"
member = "csv/gi_comuni_cap.csv"
delimiter = ";"
encoding = "utf-8"
key_by = "codiceCatastale"
[cap.columns]
codice = "codice_belfiore"
cap = "cap"
